name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No database service is needed: the integration tests and the smoke test
      # run against PGlite, which is Postgres compiled to WASM and applies the
      # same generated migrations as the Docker Compose instance.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm build
